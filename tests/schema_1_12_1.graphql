"""The root for all mutations to modify data in your Dagster instance."""
type Mutation {
  """Launches a job run."""
  launchPipelineExecution(executionParams: ExecutionParams!): LaunchRunResult!

  """Launches a job run."""
  launchRun(executionParams: ExecutionParams!): LaunchRunResult!

  """Launches multiple job runs."""
  launchMultipleRuns(executionParamsList: [ExecutionParams!]!): LaunchMultipleRunsResultOrError!

  """Re-executes a job run."""
  launchPipelineReexecution(executionParams: ExecutionParams, reexecutionParams: ReexecutionParams): LaunchRunReexecutionResult!

  """Re-executes a job run."""
  launchRunReexecution(executionParams: ExecutionParams, reexecutionParams: ReexecutionParams): LaunchRunReexecutionResult!

  """Enable a schedule to launch runs for a job at a fixed interval."""
  startSchedule(scheduleSelector: ScheduleSelector!): ScheduleMutationResult!

  """Disable a schedule from launching runs for a job."""
  stopRunningSchedule(id: String, scheduleOriginId: String, scheduleSelectorId: String): ScheduleMutationResult!

  """
  Reset a schedule to its status defined in code, otherwise disable it from launching runs for a job.
  """
  resetSchedule(scheduleSelector: ScheduleSelector!): ScheduleMutationResult!

  """
  Enable a sensor to launch runs for a job based on external state change.
  """
  startSensor(sensorSelector: SensorSelector!): SensorOrError!

  """Set a cursor for a sensor to track state across evaluations."""
  setSensorCursor(cursor: String, sensorSelector: SensorSelector!): SensorOrError!

  """Disable a sensor from launching runs for a job."""
  stopSensor(id: String, jobOriginId: String, jobSelectorId: String): StopSensorMutationResultOrError!

  """
  Reset a sensor to its status defined in code, otherwise disable it from launching runs for a job.
  """
  resetSensor(sensorSelector: SensorSelector!): SensorOrError!

  """
  Enable a sensor to launch runs for a job based on external state change.
  """
  sensorDryRun(cursor: String, selectorData: SensorSelector!): SensorDryRunResult!

  """
  Enable a schedule to launch runs for a job based on external state change.
  """
  scheduleDryRun(selectorData: ScheduleSelector!, timestamp: Float): ScheduleDryRunResult!

  """Terminates a run."""
  terminatePipelineExecution(runId: String!, terminatePolicy: TerminateRunPolicy): TerminateRunResult!

  """Terminates a run."""
  terminateRun(runId: String!, terminatePolicy: TerminateRunPolicy): TerminateRunResult!

  """Terminates a set of runs given their run IDs."""
  terminateRuns(runIds: [String!]!, terminatePolicy: TerminateRunPolicy): TerminateRunsResultOrError!

  """Deletes a run from storage."""
  deletePipelineRun(runId: String!): DeletePipelineRunResult!

  """Deletes a run from storage."""
  deleteRun(runId: String!): DeletePipelineRunResult!

  """Reloads a code location server."""
  reloadRepositoryLocation(repositoryLocationName: String!): ReloadRepositoryLocationMutationResult!

  """Reloads the workspace and its code location servers."""
  reloadWorkspace: ReloadWorkspaceMutationResult!

  """Shuts down a code location server."""
  shutdownRepositoryLocation(repositoryLocationName: String!): ShutdownRepositoryLocationMutationResult!

  """Deletes asset history from storage."""
  wipeAssets(assetPartitionRanges: [PartitionsByAssetSelector!]!): AssetWipeMutationResult!

  """Reports runless events for an asset or a subset of its partitions."""
  reportRunlessAssetEvents(eventParams: ReportRunlessAssetEventsParams!): ReportRunlessAssetEventsResult!

  """Reports an asset check evaluation result."""
  reportAssetCheckEvaluations(eventParams: ReportAssetCheckEvaluationsParams!): ReportAssetCheckEvaluationResult!

  """Launches a set of partition backfill runs."""
  launchPartitionBackfill(backfillParams: LaunchBackfillParams!): LaunchBackfillResult!

  """
  Resumes a set of partition backfill runs. Resuming a backfill will not retry any failed runs.
  """
  resumePartitionBackfill(backfillId: String!): ResumeBackfillResult!

  """
  Retries a set of partition backfill runs. Retrying a backfill will create a new backfill to retry any failed partitions.
  """
  reexecutePartitionBackfill(reexecutionParams: ReexecutionParams): LaunchBackfillResult!

  """Cancels a set of partition backfill runs."""
  cancelPartitionBackfill(backfillId: String!): CancelBackfillResult!

  """Log telemetry about the Dagster instance."""
  logTelemetry(action: String!, clientId: String!, clientTime: String!, metadata: String!): LogTelemetryMutationResult!

  """
  Store whether we've shown the nux to any user and they've dismissed or submitted it.
  """
  setNuxSeen: Boolean!

  """Adds a partition to a dynamic partition set."""
  addDynamicPartition(partitionKey: String!, partitionsDefName: String!, repositorySelector: RepositorySelector!): AddDynamicPartitionResult!

  """
  Deletes partitions from a dynamic partition set, optionally wiping materialization
  events for the deleted partitions from the assets that use the partition set.
  """
  deleteDynamicPartitions(
    partitionKeys: [String!]!
    partitionsDefName: String!
    repositorySelector: RepositorySelector!

    """
    Whether to also wipe materialization events for the deleted partition keys from all assets in the repository that use the dynamic partitions definition. Requires permission to wipe the affected assets.
    """
    wipeMaterializations: Boolean
  ): DeleteDynamicPartitionsResult!

  """
  Adds or replaces a app-managed component for a code location.
  
  Writes are last-writer-wins; concurrent calls targeting the same
  component_id resolve to whichever finishes last.
  """
  setAppManagedComponent(attributes: String!, componentId: String!, componentType: String!, locationName: String!): SetAppManagedComponentResult!

  """
  Deletes a app-managed component. Idempotent — deleting a missing id is a no-op.
  """
  deleteAppManagedComponent(componentId: String!, locationName: String!): DeleteAppManagedComponentResult!

  """
  Refreshes the defs state for a single state-backed component at a code location.
  
  Waits up to the sync-wait window for the refresh to complete: returns the
  refreshed component on success, an accepted result if the refresh is still
  running (callers should poll ``componentsForLocation``), or an error if the
  refresh failed.
  """
  refreshComponentState(defsStateKey: String!, locationName: String!): RefreshComponentStateResult!

  """Toggle asset auto materializing on or off."""
  setAutoMaterializePaused(paused: Boolean!): Boolean!

  """Sets the concurrency limit for a given concurrency key."""
  setConcurrencyLimit(concurrencyKey: String!, limit: Int!): Boolean!

  """Sets the concurrency limit for a given concurrency key."""
  deleteConcurrencyLimit(concurrencyKey: String!): Boolean!

  """Frees the concurrency slots occupied by a specific run."""
  freeConcurrencySlotsForRun(runId: String!): Boolean!

  """Frees concurrency slots."""
  freeConcurrencySlots(runId: String!, stepKey: String): Boolean!
}

