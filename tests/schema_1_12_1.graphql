"""
A component's JSON Schema pre-split server-side for react-jsonschema-form.

The raw ``schema`` carries Dagster-specific conventions (inline ``ui:*``
hints, unset-default sentinels, Jinja string escape-hatch variants). Rather
than have the frontend reverse-engineer those, the server splits the schema
once via ``dagster.components.resolved.form_schema.split_form_schema`` and
exposes the resulting RJSF-ready pair here.
"""
type ComponentFormSchema {
  """The cleaned JSON Schema RJSF validates and renders against."""
  dataSchema: JsonSchema!

  """The parallel RJSF uiSchema holding lifted ``ui:*`` hints."""
  uiSchema: JsonSchema!
}

"""Metadata for a single Component class registered in a code location."""
type ComponentTypeInfo {
  name: String!

  """
  The plugin namespace this component belongs to (e.g. ``dagster_test``).
  """
  namespace: String!

  """
  Sample YAML rendered server-side from the component's JSON Schema. Used to seed the docs ``Example`` panel.
  """
  example: String!

  """
  The JSON Schema describing the component's attributes model. May be null if the component does not declare a model.
  """
  schema: JsonSchema

  """
  The ``schema`` split server-side into the (dataSchema, uiSchema) pair react-jsonschema-form expects. Null when the component declares no model.
  """
  formSchema: ComponentFormSchema
  description: String
  owners: [String!]
  tags: [String!]

  """
  The kinds of Dagster primitives instances of this component create (e.g. ``asset``, ``schedule``, ``sensor``). Declared on the component's spec; used for picker filtering and contextual entry points. Empty when the component declares none.
