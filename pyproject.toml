[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-dagster"
version = "0.1.0"
description = "MCP pour interroger l'API GraphQL d'une instance Dagster (lecture d'abord, écriture verrouillée)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastmcp==3.4.2",
    "fastmcp-slim[client,server]==3.4.2",
    "httpx>=0.27",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-dagster = "mcp_dagster.server:mcp.run"

[tool.setuptools.packages.find]
where = ["src"]