"Enumerate the reasons an asset may have failed to materialize. Can be used to provide more granular\n    information about the failure to the user.\n    "
enum AssetMaterializationFailureReason {
  FAILED_TO_MATERIALIZE
  UPSTREAM_FAILED_TO_MATERIALIZE
  RUN_TERMINATED
  UNKNOWN
}

"An asset can fail to materialize in two ways: an unexpected/unintentional failure that should update\n    the global state of the asset to Failed, and one that indicates that the asset not materializing\n    is expected (like an optional asset or a user canceled the run).\n    "
enum AssetMaterializationFailureType {
  FAILED
  SKIPPED
}

enum AssetEventHistoryEventTypeSelector {
  MATERIALIZATION
  FAILED_TO_MATERIALIZE
  OBSERVATION
}

