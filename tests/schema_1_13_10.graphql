"""The root for all queries to retrieve data from the Dagster instance."""
type Query {
  """Retrieve the version of Dagster running in the Dagster deployment."""
  version: String!

  """Retrieve all the repositories."""
  repositoriesOrError(repositorySelector: RepositorySelector): RepositoriesOrError!

  """Retrieve a repository by its location name and repository name."""
  repositoryOrError(repositorySelector: RepositorySelector!): RepositoryOrError!

  """Retrieve the workspace and its locations."""
  workspaceOrError: WorkspaceOrError!

  """Retrieve location status for workspace locations."""
  locationStatusesOrError: WorkspaceLocationStatusEntriesOrError!

  """Retrieve a workspace entry by name."""
  workspaceLocationEntryOrError(name: String!): WorkspaceLocationEntryOrError

  """Retrieve a job by its location name, repository name, and job name."""
  pipelineOrError(params: PipelineSelector!): PipelineOrError!

  """Retrieve the list of resources for a given job."""
  resourcesOrError(pipelineSelector: PipelineSelector!): ResourcesOrError!

  """
  Retrieve a job snapshot by its id or location name, repository name, and job name.
  """
  pipelineSnapshotOrError(snapshotId: String, activePipelineSelector: PipelineSelector): PipelineSnapshotOrError!

  """
  Retrieve a graph by its location name, repository name, and graph name.
  """
  graphOrError(selector: GraphSelector): GraphOrError!

  """Retrieve the name of the scheduler running in the Dagster deployment."""
  scheduler: SchedulerOrError!

  """
  Retrieve a schedule by its location name, repository name, and schedule name.
  """
  scheduleOrError(scheduleSelector: ScheduleSelector!): ScheduleOrError!

  """Retrieve all the schedules."""
  schedulesOrError(repositorySelector: RepositorySelector!, scheduleStatus: InstigationStatus): SchedulesOrError!

  """
  Retrieve a top level resource by its location name, repository name, and resource name.
  """
  topLevelResourceDetailsOrError(resourceSelector: ResourceSelector!): ResourceDetailsOrError!

  """Retrieve all the top level resources."""
  allTopLevelResourceDetailsOrError(repositorySelector: RepositorySelector!): ResourceDetailsListOrError!

  """Retrieve all the utilized environment variables for the given repo."""
  utilizedEnvVarsOrError(repositorySelector: RepositorySelector!): EnvVarWithConsumersOrError!

  """
  Retrieve a sensor by its location name, repository name, and sensor name.
  """
  sensorOrError(sensorSelector: SensorSelector!): SensorOrError!

  """Retrieve all the sensors."""
  sensorsOrError(repositorySelector: RepositorySelector!, sensorStatus: InstigationStatus): SensorsOrError!

  """
  Retrieve the state for a schedule or sensor by its location name, repository name, and schedule/sensor name.
  """
  instigationStateOrError(instigationSelector: InstigationSelector!, id: String): InstigationStateOrError!

  """
  Retrieve the state for a group of instigators (schedule/sensor) by their containing repository id.
  """
  instigationStatesOrError(repositoryID: String!): InstigationStatesOrError!

  """
  Retrieve the partition sets for a job by its location name, repository name, and job name.
  """
  partitionSetsOrError(repositorySelector: RepositorySelector!, pipelineName: String!): PartitionSetsOrError!

  """
  Retrieve a partition set by its location name, repository name, and partition set name.
  """
  partitionSetOrError(repositorySelector: RepositorySelector!, partitionSetName: String): PartitionSetOrError!

  """Retrieve runs after applying a filter, cursor, and limit."""
  pipelineRunsOrError(filter: RunsFilter, cursor: String, limit: Int): RunsOrError!

  """Retrieve a run by its run id."""
  pipelineRunOrError(runId: ID!): RunOrError!

  """Retrieve runs after applying a filter, cursor, and limit."""
  runsOrError(filter: RunsFilter, cursor: String, limit: Int): RunsOrError!

  """Retrieve a run by its run id."""
  runOrError(runId: ID!): RunOrError!

  """
  Retrieve entries for the Runs Feed after applying a filter, cursor and limit.
  """
  runsFeedOrError(limit: Int!, cursor: String, view: RunsFeedView!, filter: RunsFilter): RunsFeedConnectionOrError!

  """
  Retrieve the number of entries for the Runs Feed after applying a filter.
  """
  runsFeedCountOrError(view: RunsFeedView!, filter: RunsFilter): RunsFeedCountOrError!

  """Retrieve the distinct tag keys from all runs."""
  runTagKeysOrError: RunTagKeysOrError

  """Retrieve all the distinct key-value tags from all runs."""
  runTagsOrError(tagKeys: [String!], valuePrefix: String, limit: Int): RunTagsOrError

  """Retrieve run IDs after applying a filter, cursor, and limit."""
  runIdsOrError(filter: RunsFilter, cursor: String, limit: Int): RunIdsOrError!

  """Retrieve a group of runs with the matching root run id."""
  runGroupOrError(runId: ID!): RunGroupOrError!

  """Retrieve whether the run configuration is valid or invalid."""
  isPipelineConfigValid(pipeline: PipelineSelector!, mode: String!, runConfigData: RunConfigData): PipelineConfigValidationResult!

  """Retrieve the execution plan for a job and its run configuration."""
  executionPlanOrError(pipeline: PipelineSelector!, mode: String!, runConfigData: RunConfigData): ExecutionPlanOrError!

  """Retrieve the run configuration schema for a job."""
  runConfigSchemaOrError(selector: PipelineSelector!, mode: String): RunConfigSchemaOrError!

  """Retrieve the instance configuration for the Dagster deployment."""
  instance: Instance!

  """
  Retrieve all assets (both with or without a definition) after providing a list of asset keys, applying a prefix filter, cursor, and limit.
  """
  assetsOrError(prefix: [String!], assetKeys: [AssetKeyInput!], cursor: String, limit: Int): AssetsOrError!

  """
  Retrieve materialized asset records after applying a prefix filter, cursor, and limit.
  """
  assetRecordsOrError(prefix: [String!], cursor: String, limit: Int): AssetRecordsOrError!

  """Retrieve an asset by asset key."""
  assetOrError(assetKey: AssetKeyInput!): AssetOrError!

  """
  Retrieve asset nodes (assets with a definition) after applying a filter on asset group, job, and asset keys.
  """
  assetNodes(group: AssetGroupSelector, pipeline: PipelineSelector, assetKeys: [AssetKeyInput!], loadMaterializations: Boolean = false): [AssetNode!]!

  """Retrieve an asset node by asset key."""
  assetNodeOrError(assetKey: AssetKeyInput!): AssetNodeOrError!

  """
  Retrieve a list of additional asset keys that must be materialized with the provided selection (due to @multi_assets with can_subset=False constraints.)
  """
  assetNodeAdditionalRequiredKeys(assetKeys: [AssetKeyInput!]!): [AssetKey!]!

  """
  Retrieve a list of asset keys where two or more repos provide an asset definition. Note: Assets should not be defined in more than one repository - this query is used to present warnings and errors in the Dagster UI.
  """
  assetNodeDefinitionCollisions(assetKeys: [AssetKeyInput!]!): [AssetNodeDefinitionCollision!]!

  """Retrieve a backfill by backfill id."""
  partitionBackfillOrError(backfillId: String!): PartitionBackfillOrError!

  """
  Fetch the partitions that would be targeted by a backfill, given the root partitions targeted.
  """
  assetBackfillPreview(params: AssetBackfillPreviewParams!): [AssetPartitions!]!

  """Retrieve backfills after applying a status filter, cursor, and limit."""
  partitionBackfillsOrError(status: BulkActionStatus, cursor: String, limit: Int, filters: BulkActionsFilter): PartitionBackfillsOrError!

  """Retrieve the set of permissions for the Dagster deployment."""
  permissions: [Permission!]!

  """
  Returns whether the user has permission to terminate runs in the deployment
  """
  canBulkTerminate: Boolean!

  """
  Retrieve the latest materializations for a set of assets by asset keys.
  """
  assetsLatestInfo(assetKeys: [AssetKeyInput!]!): [AssetLatestInfo!]!

  """Retrieve event logs after applying a run id filter, cursor, and limit."""
  logsForRun(runId: ID!, afterCursor: String, limit: Int): EventConnectionOrError!

  """Retrieve the captured log metadata for a given log key."""
  capturedLogsMetadata(logKey: [String!]!): CapturedLogsMetadata!

  """Captured logs are the stdout/stderr logs for a given log key"""
  capturedLogs(logKey: [String!]!, cursor: String, limit: Int): CapturedLogs!

  """Whether or not the NUX should be shown to the user"""
  shouldShowNux: Boolean!

  """Provides fields for testing behavior"""
  test: TestFields

  """Retrieve the auto materialization evaluation records for an asset."""
  autoMaterializeAssetEvaluationsOrError(assetKey: AssetKeyInput!, limit: Int!, cursor: String): AutoMaterializeAssetEvaluationRecordsOrError

  """
  Retrieve the partition keys which were true for a specific automation condition evaluation node.
  """
  truePartitionsForAutomationConditionEvaluationNode(assetKey: AssetKeyInput, evaluationId: ID!, nodeUniqueId: String): [String!]!

  """
  Retrieve the auto materialization evaluation records for a given evaluation ID.
  """
  autoMaterializeEvaluationsForEvaluationId(evaluationId: ID!): AutoMaterializeAssetEvaluationRecordsOrError

  """Retrieve the condition evaluation for an asset and partition."""
  assetConditionEvaluationForPartition(assetKey: AssetKeyInput, evaluationId: ID!, partition: String!): AssetConditionEvaluation

  """Retrieve the condition evaluation records for an asset."""
  assetConditionEvaluationRecordsOrError(assetKey: AssetKeyInput, assetCheckKey: AssetCheckHandleInput, limit: Int!, cursor: String): AssetConditionEvaluationRecordsOrError

  """Retrieve the condition evaluation records for a given evaluation ID."""
  assetConditionEvaluationsForEvaluationId(evaluationId: ID!): AssetConditionEvaluationRecordsOrError

  """Fetch the history of auto-materialization ticks"""
  autoMaterializeTicks(dayRange: Int, dayOffset: Int, limit: Int, cursor: String, statuses: [InstigationTickStatus!], beforeTimestamp: Float, afterTimestamp: Float): [InstigationTick!]!

  """Retrieve the executions for a given asset check."""
  assetCheckExecutions(
    assetKey: AssetKeyInput!
    checkName: String!

    """
    Optional partition key filter. When omitted, returns all executions across all partitions. When set to empty string (""), returns only unpartitioned executions. When set to a specific value, returns executions for that partition.
    """
    partition: String
    limit: Int!
    cursor: String
  ): [AssetCheckExecution!]!

  """Retrieve the latest available DefsStateInfo for the current workspace."""
  latestDefsStateInfo: DefsStateInfo

  """
  Retrieve all app-managed components stored for a given code location. The returned list is sourced from the instance's defs state storage and is independent of whether the location is currently loaded.
  """
  appManagedComponentsForLocationOrError(locationName: String!): AppManagedComponentsOrError!

  """
  Retrieve the JSON schemas and metadata for every Component class installed in a given code location. Reads from the location's repository metadata, so the location must be loaded.
  """
  componentTypesForLocationOrError(locationName: String!): ComponentTypesOrError!
}

